# 应用服务 WEB 访问端口
server:
  port: 8080

#  MyBatis
mybatis:
  mapper-locations: "classpath:mappers/*xml"
  type-aliases-package: org.example.ticket_platfrom.entity
#数据库连接
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ticket_platfrom?charactorEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  #Redis连接
  data:
    redis:
      host: 192.168.111.132
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
