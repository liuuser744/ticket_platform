# 应用服务 WEB 访问端口
server:
  port: 8080

#  MyBatis
mybatis:
  mapper-locations: "classpath:mappers/*xml"
  type-aliases-package: org.example.ticket_platform.entity
  configuration:
    # 数据库列名 user_id / create_time 自动映射到实体 userId / createTime
    map-underscore-to-camel-case: true
#数据库连接
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ticket_platform_simple?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
  #Redis连接
  data:
    redis:
      host: 192.168.111.132
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
jwt:
  secret: "this-is-a-very-long-secret-key-at-least-32-bytes-long!!"
  access-expiration:  7200000